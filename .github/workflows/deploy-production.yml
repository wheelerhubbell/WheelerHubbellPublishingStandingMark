name: Deploy production from GitHub
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: whp-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy this exact GitHub checkout to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: npx --yes netlify-cli@latest deploy --prod --dir=. --functions=netlify/functions --site=0347a387-82b7-4b7f-b528-1024ad79b9e7 --message "GitHub $GITHUB_SHA"
