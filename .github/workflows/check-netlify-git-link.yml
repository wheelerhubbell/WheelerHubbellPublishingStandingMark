name: Read-only Netlify Git connection check
on:
  push:
    branches: [ops/check-netlify-git-link-20260916]
    paths: ['.github/workflows/check-netlify-git-link.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect only the intended site and its latest deploy records
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 0347a387-82b7-4b7f-b528-1024ad79b9e7
        run: |
          node --input-type=module <<'JS'
          const token=process.env.NETLIFY_AUTH_TOKEN;
          const id=process.env.NETLIFY_SITE_ID;
          const result={checked_at:new Date().toISOString(),read_only:true,site_id:id,credential_present:Boolean(token)};
          if(!token){console.log(JSON.stringify(result,null,2));process.exit(1);}
          async function read(path){
            const r=await fetch('https://api.netlify.com/api/v1'+path,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(20000),redirect:'error'});
            return {status:r.status,data:r.ok?await r.json():null};
          }
          const site=await read('/sites/'+id);
          result.site_http_status=site.status;
          if(site.data){
            const s=site.data,b=s.build_settings??{};
            result.site={id:s.id,name:s.name,account_id:s.account_id,repo_url:b.repo_url??null,repo_path:b.repo_path??null,repo_branch:b.repo_branch??null,provider:b.provider??null,stop_builds:b.stop_builds??null,build_command:b.cmd??null,publish_directory:b.dir??null,builds_enabled:s.builds_enabled??null};
            const deploys=await read('/sites/'+id+'/deploys?per_page=5');
            result.deploys_http_status=deploys.status;
            result.deploys=(deploys.data??[]).map(d=>({id:d.id,state:d.state,build_id:d.build_id,commit_ref:d.commit_ref,branch:d.branch,deploy_source:d.deploy_source,created_at:d.created_at,published_at:d.published_at,error_message:d.error_message??null}));
          }else{
            const user=await read('/user');
            result.credential_user_http_status=user.status;
            result.credential_user_id=user.data?.id??null;
          }
          console.log(JSON.stringify(result,null,2));
          if(site.status!==200)process.exitCode=1;
          JS
