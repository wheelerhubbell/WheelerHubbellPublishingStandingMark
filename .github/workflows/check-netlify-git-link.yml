name: Read-only Git production deployment evidence
on:
  push:
    branches: [ops/check-netlify-git-link-20260916]
    paths: ['.github/workflows/check-netlify-git-link.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Observe exact Git deploy and collect nonsecret evidence
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import {writeFile} from 'node:fs/promises';
          const token=process.env.NETLIFY_AUTH_TOKEN,site='0347a387-82b7-4b7f-b528-1024ad79b9e7',commit='0361bd9d011582290cd544908d5065e23990baf1';
          if(!token)throw Error('Stored Netlify credential absent');
          const sensitive=[token];
          function redact(text){let s=String(text);for(const value of sensitive)if(value)s=s.split(value).join('[REDACTED]');return s.replace(/-----BEGIN [^-]*PRIVATE KEY-----[\s\S]*?-----END [^-]*PRIVATE KEY-----/g,'[REDACTED PRIVATE KEY]').replace(/postgres(?:ql)?:\/\/[^\s"']+/g,'[REDACTED DATABASE URL]');}
          async function read(path){const r=await fetch('https://api.netlify.com/api/v1'+path,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(15000),redirect:'error'});if(!r.ok)throw Error('Netlify read HTTP '+r.status);return r.json();}
          let deploy;
          for(let i=0;i<18;i++){
            const ds=await read('/sites/'+site+'/deploys?per_page=10');deploy=ds.find(d=>d.commit_ref===commit);
            if(deploy&&['ready','error','rejected','cancelled'].includes(deploy.state))break;
            await new Promise(r=>setTimeout(r,5000));
          }
          const report={checked_at:new Date().toISOString(),read_only:true,source_commit:commit,site_id:site,payment_executed:false,deploy:deploy?{id:deploy.id,build_id:deploy.build_id,state:deploy.state,commit_ref:deploy.commit_ref,published_at:deploy.published_at??null}:null};
          console.log(JSON.stringify(report));
          if(deploy){
            const url=new URL('https://app.netlify.com/access-control/generate-access-control-token');url.searchParams.set('site_id',site);url.searchParams.set('deploy_id',deploy.id);
            const auth=await fetch(url,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(15000),redirect:'error'});
            report.log_access_http_status=auth.status;
            if(auth.ok){
              const a=await auth.json(),access=a.accessControlToken;sensitive.push(access);
              if(access){
                const lines=[];
                await new Promise(resolve=>{
                  const ws=new WebSocket('wss://socketeer.services.netlify.com/build/logs');let idle,done=false;
                  function finish(){if(done)return;done=true;clearTimeout(idle);clearTimeout(deadline);ws.close();resolve();}
                  const deadline=setTimeout(finish,30000);
                  ws.addEventListener('open',()=>ws.send(JSON.stringify({access_token:access,site_id:site,deploy_id:deploy.id})));
                  ws.addEventListener('message',event=>{for(const part of String(event.data).split('\n')){if(!part.trim())continue;try{const e=JSON.parse(part);lines.push(redact(e.message??''));}catch{lines.push('[non-JSON log event]');}}clearTimeout(idle);idle=setTimeout(finish,4000);});
                  ws.addEventListener('error',()=>{report.log_connection_error=true;finish();});ws.addEventListener('close',finish);
                });
                report.build_log_messages=lines.length;
                report.relevant_build_log=lines.filter(x=>/activation_authority_verified|deployment_|error|Error|failed|Failed|pass |fail |tests |subtests|Subtest|completed|published|Published|live_|WHP_USE_NETLIFY_DATABASE|42501|permission|read.only/i.test(x));
                await writeFile('netlify-build.log',lines.join('\n')+'\n');
              }
            }
          }
          report.public_reads=[];
          for(const path of ['/healthz','/.well-known/whp-standing.json']){
            const r=await fetch('https://wheeler-hubbell-publishing-standing-mark.netlify.app'+path,{signal:AbortSignal.timeout(15000),redirect:'error'});
            const raw=await r.text();let data;try{data=JSON.parse(raw);}catch{data={parse_error:true};}
            report.public_reads.push({path,status:r.status,service:data.service,version:data.version,environment:data.environment,root_pin:data.root_pin,evaluation_url:data.evaluation_url,live_completion_proven:data.live_completion_proven});
          }
          await writeFile('deployment-readback.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-git-production-deployment-evidence
          path: |
            deployment-readback.json
            netlify-build.log
          if-no-files-found: error
