name: Read-only Netlify build failure evidence
on:
  push:
    branches: [ops/check-netlify-git-link-20260916]
    paths: ['.github/workflows/check-netlify-git-link.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read the exact failed build log
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const token=process.env.NETLIFY_AUTH_TOKEN;
          if(!token)throw Error('Stored Netlify credential absent');
          function redact(text){return String(text).split(token).join('[REDACTED]').replace(/-----BEGIN [^-]*PRIVATE KEY-----[\s\S]*?-----END [^-]*PRIVATE KEY-----/g,'[REDACTED PRIVATE KEY]').replace(/postgres(?:ql)?:\/\/[^\s"']+/g,'[REDACTED DATABASE URL]').replace(/(Bearer\s+)[A-Za-z0-9._-]+/gi,'$1[REDACTED]');}
          const paths=[
            '/sites/0347a387-82b7-4b7f-b528-1024ad79b9e7',
            '/builds/6aaacd1fff6a7a00098455b0',
            '/deploys/6aaacd1fff6a7a00098455b2/log',
            '/builds/6aaacd1fff6a7a00098455b0/log'
          ];
          for(const path of paths){
            const r=await fetch('https://api.netlify.com/api/v1'+path,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(20000),redirect:'error'});
            console.log(JSON.stringify({read_only:true,path,status:r.status,content_type:r.headers.get('content-type')}));
            if(!r.ok)continue;
            const text=await r.text();
            if(path.endsWith('/log')){console.log(redact(text).slice(-28000));continue;}
            const data=JSON.parse(text);
            console.log(JSON.stringify({keys:Object.keys(data),id:data.id,site_id:data.site_id,state:data.state,error:data.error,error_message:data.error_message,done:data.done,repo:data.repo?{provider:data.repo.provider,repo_path:data.repo.repo_path,repo_branch:data.repo.repo_branch,repo_url:data.repo.repo_url,cmd:data.repo.cmd,dir:data.repo.dir,stop_builds:data.repo.stop_builds}:null}));
          }
          JS
