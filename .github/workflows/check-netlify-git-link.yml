name: Unpaid production service verification
on:
  push:
    branches: [ops/check-netlify-git-link-20260916]
    paths: ['.github/workflows/check-netlify-git-link.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0361bd9d011582290cd544908d5065e23990baf1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Observe public service and unpaid purchase only
        run: |
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          import {randomBytes} from 'node:crypto';
          import {canonical,parseStrict,hash} from './src/canonical.mjs';
          import {validateTrust,authorize} from './src/authority.mjs';
          import {validateSubmission} from './src/validation.mjs';
          const origin='https://wheeler-hubbell-publishing-standing-mark.netlify.app';
          const source='0361bd9d011582290cd544908d5065e23990baf1';
          const report={observed_at:new Date().toISOString(),source_commit:source,origin,production_code_changed:false,deployment_triggered:false,payment_sent:false,wallet_used:false,probe:'Deliberately ineligible sample; unpaid quotation and durable purchase identity only. Not proof of eligible live issuance.'};
          async function request(path,method='GET',body){
            const started=Date.now();
            const r=await fetch(origin+path,{method,headers:body===undefined?{}:{'content-type':'application/json'},body,redirect:'error',signal:AbortSignal.timeout(20000)});
            const raw=await r.text();let data;try{data=parseStrict(raw,1048576);}catch{data=null;}
            return {status:r.status,elapsed_ms:Date.now()-started,request_id:r.headers.get('x-nf-request-id'),payment_required:r.headers.get('payment-required'),data};
          }
          try{
            const [health,discovery,resolution]=await Promise.all([request('/healthz'),request('/.well-known/whp-standing.json'),request('/.well-known/standing-capability.json')]);
            report.health={status:health.status,data:health.data};
            report.discovery={status:discovery.status,environment:discovery.data?.environment,evaluation_url:discovery.data?.evaluation_url};
            report.resolution={status:resolution.status};
            const root=JSON.parse(await readFile('public/authority/root.json','utf8'));
            if(resolution.status===200){
              const p=resolution.data.payload,at=Math.floor(Date.now()/1000),trust=validateTrust(p.trust_bundle,root.root_pin,at);
              authorize(resolution.data,'WHP-CAPABILITY-RESOLUTION-v1','DISCOVERY',p.authority_context,trust);
              report.resolution.signature_verified=true;report.resolution.current=p.observed_at<=at+30&&at<p.valid_until;report.resolution.service_origin=p.service_origin;
            }
            const sample=JSON.parse(await readFile('public/examples/submission.TEST.json','utf8'));
            const now=Math.floor(Date.now()/1000);
            sample.client_reference=randomBytes(32).toString('hex');
            sample.bounds={scope:'whp-standing-structured-passage',jurisdiction:'protocol-structural-assessment-only',valid_from:now-30,valid_until:now+900};
            validateSubmission(sample);
            const body=canonical(sample),first=await request('/v1/evaluations','POST',body);
            report.unpaid_post={status:first.status,elapsed_ms:first.elapsed_ms,request_id:first.request_id,error:first.data?.error??null,payment_required_header_present:Boolean(first.payment_required),eligibility:first.data?.eligibility??null};
            if(first.status===402){
              const terms=first.data,quote=terms.extensions?.['whp-standing']?.info?.quote;
              const trust=validateTrust(discovery.data.trust_bundle,root.root_pin,Math.floor(Date.now()/1000));
              authorize(quote,'WHP-STANDING-QUOTE-v1.1','ISSUER',sample.bounds,trust);
              report.unpaid_post.quote_signature_verified=true;report.unpaid_post.request_hash_matches=quote.payload.request_hash===hash(sample);
              report.unpaid_post.x402_version=terms.x402Version;report.unpaid_post.payment_requirements=terms.accepts;
              const second=await request('/v1/evaluations','POST',body);
              report.idempotent_repeat={status:second.status,same_purchase_id:second.data?.purchase_id===terms.purchase_id};
              const retrieval=await request('/v1/purchases/'+terms.purchase_id+'/result');
              report.unpaid_retrieval={status:retrieval.status,state:retrieval.data?.state??null,error:retrieval.data?.error??null};
              report.expected_negative_eligibility=terms.eligibility?.can_produce_mark===false;
            }
          }catch(e){report.probe_error={code:e.code??null,message:e.message};}
          await writeFile('live-unpaid-verification.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-unpaid-verification
          path: live-unpaid-verification.json
          if-no-files-found: error
