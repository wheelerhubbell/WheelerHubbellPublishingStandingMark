name: Read-only Netlify deployment readback
on:
  push:
    branches: [ops/check-netlify-git-link-20260916]
    paths: ['.github/workflows/check-netlify-git-link.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read deployment state and validate configuration without exposing values
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import {createPrivateKey} from 'node:crypto';
          const token=process.env.NETLIFY_AUTH_TOKEN,site='0347a387-82b7-4b7f-b528-1024ad79b9e7';
          if(!token)throw Error('Stored Netlify credential absent');
          async function read(path){const r=await fetch('https://api.netlify.com/api/v1'+path,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(20000),redirect:'error'});return {status:r.status,data:r.ok?await r.json():null};}
          const vars=await read('/accounts/6aaaa6b474ff8bfac03a4352/env?site_id='+site);
          const env={};
          if(Array.isArray(vars.data))for(const v of vars.data){const value=v.values?.find(x=>x.context==='production')??v.values?.find(x=>x.context==='all');if(value)env[v.key]=value.value;}
          const config={env_http_status:vars.status,managed_database_selected:env.WHP_USE_NETLIFY_DATABASE==='true'};
          try{JSON.parse(env.WHP_PAYMENT_REQUIREMENTS_JSON);config.payment_json_valid=true;}catch{config.payment_json_valid=false;}
          try{createPrivateKey(env.WHP_ISSUER_PRIVATE_KEY);config.issuer_private_key_parses=true;}catch{config.issuer_private_key_parses=false;}
          console.log(JSON.stringify({read_only:true,config}));
          const deploys=await read('/sites/'+site+'/deploys?per_page=5');
          console.log(JSON.stringify({deploys_http_status:deploys.status,deploys:(deploys.data??[]).map(d=>({id:d.id,state:d.state,build_id:d.build_id,commit_ref:d.commit_ref,branch:d.branch,created_at:d.created_at,published_at:d.published_at,error_message:d.error_message??null}))},null,2));
          for(const path of ['/healthz','/.well-known/whp-standing.json']){
            const r=await fetch('https://wheeler-hubbell-publishing-standing-mark.netlify.app'+path,{signal:AbortSignal.timeout(20000),redirect:'error'});
            const body=await r.text();
            console.log(JSON.stringify({public_get:path,status:r.status,body:body.slice(0,7000)}));
          }
          JS
