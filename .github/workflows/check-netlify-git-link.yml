name: Read-only exact Netlify build diagnosis
on:
  push:
    branches: [ops/check-netlify-git-link-20260916]
    paths: ['.github/workflows/check-netlify-git-link.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e9033a5080b2df97cfdbeba5cbd3e688e8039427
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only source activation check
        run: node scripts/check-activation.mjs
        continue-on-error: true
      - name: Read actual build log and validate environment without disclosing values
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import {createPrivateKey,createPublicKey} from 'node:crypto';
          import {readFile} from 'node:fs/promises';
          const token=process.env.NETLIFY_AUTH_TOKEN,site='0347a387-82b7-4b7f-b528-1024ad79b9e7',deploy='6aaace7ee28bf30008dfcd4c';
          if(!token)throw Error('Stored Netlify credential absent');
          const sensitive=[token];
          function redact(text){let s=String(text);for(const value of sensitive)if(value)s=s.split(value).join('[REDACTED]');return s.replace(/-----BEGIN [^-]*PRIVATE KEY-----[\s\S]*?-----END [^-]*PRIVATE KEY-----/g,'[REDACTED PRIVATE KEY]').replace(/postgres(?:ql)?:\/\/[^\s"']+/g,'[REDACTED DATABASE URL]');}
          async function read(path){const r=await fetch('https://api.netlify.com/api/v1'+path,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(15000),redirect:'error'});return {status:r.status,data:r.ok?await r.json():null};}
          const siteResult=await read('/sites/'+site);
          const s=siteResult.data??{};
          let vars=await read('/sites/'+site+'/env?context_name=production');
          if(vars.status!==200&&(s.account_id||s.account_slug))vars=await read('/accounts/'+encodeURIComponent(s.account_id??s.account_slug)+'/env?site_id='+site);
          console.log(JSON.stringify({read_only:true,env_http_status:vars.status}));
          if(Array.isArray(vars.data)){
            const env={};for(const v of vars.data){const value=v.values?.find(x=>x.context==='production')??v.values?.find(x=>x.context==='all');if(value)env[v.key]=value.value;}
            sensitive.push(env.WHP_ISSUER_PRIVATE_KEY,env.DATABASE_URL,env.NETLIFY_DB_URL);
            const config={managed_database_selected:env.WHP_USE_NETLIFY_DATABASE==='true',present_keys:Object.keys(env)};
            try{JSON.parse(env.WHP_PAYMENT_REQUIREMENTS_JSON);config.payment_json_valid=true;}catch{config.payment_json_valid=false;}
            try{const key=createPrivateKey(env.WHP_ISSUER_PRIVATE_KEY);config.issuer_private_key_parses=true;const pub=createPublicKey(key).export({type:'spki',format:'der'}).toString('base64');const root=JSON.parse(await readFile('public/authority/root.json','utf8'));config.issuer_key_matches_authority=root.trust_bundle.certificates.some(c=>c.payload.public_key===pub);}catch{config.issuer_private_key_parses=false;}
            console.log(JSON.stringify(config));
          }
          const url=new URL('https://app.netlify.com/access-control/generate-access-control-token');url.searchParams.set('site_id',site);url.searchParams.set('deploy_id',deploy);
          const auth=await fetch(url,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(15000),redirect:'error'});
          console.log(JSON.stringify({log_access_http_status:auth.status}));
          if(auth.ok){
            const a=await auth.json();const access=a.accessControlToken;
            if(!access){console.log(JSON.stringify({log_token_missing:true,response_keys:Object.keys(a)}));process.exit(1);}
            sensitive.push(access);
            await new Promise(resolve=>{
              const ws=new WebSocket('wss://socketeer.services.netlify.com/build/logs');let idle;let messages=0;let done=false;
              function finish(){if(done)return;done=true;clearTimeout(idle);clearTimeout(deadline);ws.close();console.log(JSON.stringify({build_log_messages:messages}));resolve();}
              const deadline=setTimeout(finish,30000);
              ws.addEventListener('open',()=>ws.send(JSON.stringify({access_token:access,site_id:site,deploy_id:deploy})));
              ws.addEventListener('message',event=>{messages++;console.log(redact(event.data));clearTimeout(idle);idle=setTimeout(finish,5000);});
              ws.addEventListener('error',()=>{console.log(JSON.stringify({build_log_connection_error:true}));finish();});
              ws.addEventListener('close',finish);
            });
          }
          JS
