name: Existing database connectivity check
on:
  push:
    branches: ["admin/netlify-config-transfer-20260916"]
    paths: [".github/workflows/netlify-config-transfer.yml"]
permissions:
  contents: read
jobs:
  database-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Install the already-pinned database driver in a temporary directory
        run: npm install --prefix "$RUNNER_TEMP/whp-db-check" --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Read database schema metadata without changing records
        env:
          SOURCE_NETLIFY_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NODE_NO_WARNINGS: "1"
        run: |
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          import {writeFileSync} from 'node:fs';
          const require=createRequire(process.env.RUNNER_TEMP+'/whp-db-check/package.json');
          const {Pool}=require('pg');
          let pool;
          try{
           const r=await fetch('https://api.netlify.com/api/v1/sites/813ee022-f4d9-4d8e-a974-86158583a39f/database?role=netlifydb_owner',{headers:{Authorization:'Bearer '+process.env.SOURCE_NETLIFY_TOKEN},redirect:'error',signal:AbortSignal.timeout(20000)});
           if(!r.ok)throw Object.assign(new Error('DATABASE_API_FAILED'),{code:'DATABASE_API_'+r.status});
           const db=await r.json();if(typeof db.connection_string!=='string')throw new Error('DATABASE_CONNECTION_MISSING');
           pool=new Pool({connectionString:db.connection_string,connectionTimeoutMillis:15000,max:1});
           const q=await pool.query("SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('purchases','registry_events','review_requests') ORDER BY table_name");
           const names=q.rows.map(x=>x.table_name);
           if(JSON.stringify(names)!==JSON.stringify(['purchases','registry_events','review_requests']))throw Object.assign(new Error('SCHEMA_MISSING'),{code:'SCHEMA_MISSING'});
           const report={database_access_verified:true,existing_database_preserved:true,required_tables:names,customer_records_read:false,payment_executed:false,deployment_triggered:false};
           writeFileSync('database-readiness.json',JSON.stringify(report)+'\n');console.log(JSON.stringify(report));
          }catch(e){console.error(JSON.stringify({database_access_verified:false,error:typeof e.code==='string'&&/^[A-Z0-9_]+$/.test(e.code)?e.code:'DATABASE_CONNECTION_FAILED'}));process.exitCode=1;}finally{if(pool)await pool.end();}
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: existing-database-readiness
          path: database-readiness.json
          retention-days: 1
          if-no-files-found: error
