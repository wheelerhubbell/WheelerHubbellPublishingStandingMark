name: Deploy committed WHP authority to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whp-current-production-authority
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: '0347a387-82b7-4b7f-b528-1024ad79b9e7'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python3 -m pip install -r requirements-verification.txt
      - name: Verify the committed authority and full TEST acquisition gate
        run: |
          set -Eeuo pipefail
          test -n "$NETLIFY_AUTH_TOKEN" || { echo 'NETLIFY_AUTH_TOKEN is not configured'; exit 1; }
          mkdir -p artifacts
          npm run check:activation | tee artifacts/authority-check.json
          npm run check:open-acquisition
          cp evidence/open-acquisition/recursive-chain.json artifacts/recursive-chain.json
          git restore -- evidence/open-acquisition/recursive-chain.json
      - name: Bind deployment to the exact committed source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git diff --cached --quiet
          node --input-type=module <<'JS'
          import {writeFile} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          import {PROFILE_HASH} from './src/profile.mjs';
          import {CONTRACT_HASH, VERIFIER_HASH} from './src/protocol.mjs';
          const git = (...args) => execFileSync('git', args, {encoding: 'utf8'}).trim();
          await writeFile('public/deployment.json', JSON.stringify({
            source_commit: git('rev-parse', 'HEAD'),
            source_tree: git('rev-parse', 'HEAD^{tree}'),
            site_id: process.env.NETLIFY_SITE_ID,
            profile_sha256: PROFILE_HASH,
            contract_sha256: CONTRACT_HASH,
            verifier_sha256: VERIFIER_HASH
          }, null, 2) + '\n');
          JS
      - name: Verify Netlify site access before uploading
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID" \
            | tee artifacts/netlify-site.json >/dev/null
      - name: Verify source-only gates before uploading
        run: |
          set -Eeuo pipefail
          npm run check:activation
          npm run check:open-acquisition
      - name: Deploy the exact committed tree to the existing production site
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git diff --cached --quiet
          npx -y netlify-cli@27.7.0 deploy --prod --dir=public --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --json | tee artifacts/netlify-deploy.json
      - name: Verify the deployed source stamp
        env:
          EXPECTED_DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          const expected = JSON.parse(await readFile('public/deployment.json', 'utf8'));
          const response = await fetch('https://wheeler-hubbell-publishing-standing-mark.netlify.app/deployment.json', {
            headers: {'cache-control': 'no-cache'}
          });
          if (!response.ok) throw new Error(`DEPLOYMENT_STAMP_HTTP_${response.status}`);
          const actual = await response.json();
          if (actual.source_commit !== process.env.EXPECTED_DEPLOY_COMMIT) throw new Error('DEPLOYED_COMMIT_MISMATCH');
          if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error('DEPLOYED_SOURCE_STAMP_MISMATCH');
          console.log(JSON.stringify({deployed_commit: actual.source_commit, site_id: actual.site_id}));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whp-production-sync
          path: |
            artifacts/authority-check.json
            artifacts/recursive-chain.json
            artifacts/netlify-site.json
            artifacts/netlify-deploy.json
          if-no-files-found: ignore
