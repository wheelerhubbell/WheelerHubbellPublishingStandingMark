name: Remove WHP buyer proof from acquisition boundary

on:
  push:
    branches:
      - remove-buyer-proof-20260916

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'fix: direct machine acquisition to x402 without WHP buyer proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-buyer-proof-20260916
          fetch-depth: 0
      - name: Apply correction
        run: python scripts/remove-buyer-proof.py
      - name: Verify corrected boundary only
        run: node scripts/test-no-client-proof.mjs
      - name: Commit repaired acquisition surface
        run: |
          git config user.name 'wheelerhubbell'
          git config user.email 'wheelerhubbell@gmail.com'
          git add src/service.mjs src/buyer.mjs src/discovery.mjs public/openapi.json
          git commit -m 'fix: direct machine acquisition to x402 without WHP buyer proof'
          git push origin HEAD:remove-buyer-proof-20260916
