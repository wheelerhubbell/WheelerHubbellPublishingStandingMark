name: x402 registry propagation

on:
  push:
    branches:
      - x402-registry-propagation-20260916

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Submit WHP Standing evaluation endpoint to x402dash
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://wheelerhubbellpublishingstandingmark.netlify.app/v1/evaluations'
          payload=$(cat <<'JSON'
          {
            "url": "https://wheelerhubbellpublishingstandingmark.netlify.app/v1/evaluations",
            "name": "WHP Standing",
            "description": "Machine-verifiable standing under explicit authority and bounds. Submit a structured object/provenance graph; receive x402 payment terms, then a durable independently verifiable WHP Standing Mark or bounded negative assessment.",
            "tags": ["ai-agents", "x402", "provenance", "authority", "machine-verifiable-standing", "decision-integrity"],
            "contact": "https://github.com/wheelerhubbell/WheelerHubbellPublishingStandingMark"
          }
          JSON
          )
          status=$(curl --fail-with-body -sS -o response.json -w '%{http_code}' \
            -X POST 'https://api.x402dash.com/v1/register' \
            -H 'content-type: application/json' \
            --data "$payload" || true)
          echo "HTTP_STATUS=$status"
          cat response.json || true
          echo
          node - <<'NODE'
          const fs=require('fs');
          const status=process.env.STATUS;
          NODE
          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo 'REGISTRATION_ACCEPTED=true'
          else
            echo 'REGISTRATION_ACCEPTED=false'
            exit 1
          fi
