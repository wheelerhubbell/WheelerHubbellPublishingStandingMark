name: x402 registry propagation

on:
  push:
    branches:
      - x402-registry-propagation-20260916

permissions:
  contents: read

jobs:
  register-x402scan:
    runs-on: ubuntu-latest
    steps:
      - name: Discover and register WHP Standing on x402scan
        shell: bash
        run: |
          set -euo pipefail
          origin='https://wheelerhubbellpublishingstandingmark.netlify.app'
          base='https://www.x402scan.com/api/trpc'

          echo '--- DISCOVERY CHECK ---'
          check_status=$(curl -sS -o check.json -w '%{http_code}' \
            -X POST "$base/public.resources.checkDiscovery" \
            -H 'content-type: application/json' \
            -H 'x-trpc-source: nextjs-react' \
            --data '{"json":{"origin":"https://wheelerhubbellpublishingstandingmark.netlify.app","bustCache":true}}')
          echo "HTTP_STATUS=$check_status"
          cat check.json
          echo

          echo '--- ORIGIN REGISTRATION ---'
          reg_status=$(curl -sS -o register.json -w '%{http_code}' \
            -X POST "$base/public.resources.registerFromOrigin" \
            -H 'content-type: application/json' \
            -H 'x-trpc-source: nextjs-react' \
            --data '{"json":{"origin":"https://wheelerhubbellpublishingstandingmark.netlify.app"}}')
          echo "HTTP_STATUS=$reg_status"
          cat register.json
          echo

          python - <<'PY'
          import json, sys
          raw=json.load(open('register.json'))
          data=raw.get('result',{}).get('data',{}).get('json',raw.get('result',{}).get('data',{})) if isinstance(raw,dict) else raw
          print('PARSED_REGISTRATION_RESULT=',json.dumps(data,sort_keys=True))
          if isinstance(data,dict) and data.get('success') is True:
              print('X402SCAN_REGISTRATION_ACCEPTED=true')
              sys.exit(0)
          print('X402SCAN_REGISTRATION_ACCEPTED=false')
          sys.exit(1)
          PY
