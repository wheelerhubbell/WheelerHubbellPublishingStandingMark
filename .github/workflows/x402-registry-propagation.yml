name: x402 registry propagation

on:
  push:
    branches:
      - x402-registry-propagation-20260916

permissions:
  contents: read

jobs:
  inspect-x402scan:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public x402scan registration client
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.x402scan.com'
          curl -fsSL "$base/resources/register" -o page.html
          python - <<'PY'
          import re, urllib.parse
          html=open('page.html',encoding='utf-8').read()
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+\.js[^"\']*)',html)
          with open('scripts.txt','w') as f:
              for s in srcs:
                  f.write(urllib.parse.urljoin('https://www.x402scan.com/resources/register',s)+'\n')
          print('SCRIPT_COUNT',len(srcs))
          PY
          : > candidates.txt
          i=0
          while IFS= read -r url; do
            i=$((i+1))
            file="chunk-$i.js"
            curl -fsSL "$url" -o "$file" || continue
            grep -aoE '.{0,140}(discoverOriginSchema|resources/register|registerOrigin|register|/api/[A-Za-z0-9_?=&./:{}-]+).{0,220}' "$file" >> candidates.txt || true
          done < scripts.txt
          echo '--- REGISTRATION CLIENT CANDIDATES ---'
          sed -n '1,240p' candidates.txt
