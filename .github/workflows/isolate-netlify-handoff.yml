name: Isolate GitHub to Netlify handoff (GET only)

on:
  push:
    branches: [diagnostic-netlify-handoff-20260919]
    paths: ['.github/workflows/isolate-netlify-handoff.yml']

permissions: {}

jobs:
  inspect-access:
    if: github.ref == 'refs/heads/diagnostic-netlify-handoff-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect existing credential access without changing Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const expected = {
            site_id: '0347a387-82b7-4b7f-b528-1024ad79b9e7',
            account_id: '6aaaa6b474ff8bfac03a4352',
            account_slug: 'wheelerhubbellobituaries',
            origin: 'https://wheeler-hubbell-publishing-standing-mark.netlify.app',
            repository: 'wheelerhubbell/WheelerHubbellPublishingStandingMark'
          };
          const report = {
            checked_at: new Date().toISOString(),
            source_commit: process.env.GITHUB_SHA,
            run_id: process.env.GITHUB_RUN_ID,
            expected,
            credential_present: Boolean(process.env.NETLIFY_AUTH_TOKEN),
            requests: [],
            remote_mutations: false,
            deployment_attempted: false,
            database_accessed: false,
            payment_executed: false
          };
          async function get(path) {
            const observation = {method: 'GET', path};
            report.requests.push(observation);
            try {
              const response = await fetch('https://api.netlify.com/api/v1' + path, {
                method: 'GET',
                headers: {Authorization: 'Bearer ' + process.env.NETLIFY_AUTH_TOKEN, Accept: 'application/json'},
                redirect: 'error',
                signal: AbortSignal.timeout(20000)
              });
              observation.http_status = response.status;
              observation.request_id = response.headers.get('x-nf-request-id');
              const body = await response.json().catch(() => null);
              return {ok: response.ok, status: response.status, body};
            } catch (error) {
              observation.transport_error_type = error.name;
              return {ok: false, status: null, body: null};
            }
          }
          if (!report.credential_present) {
            report.finding = 'GITHUB_NETLIFY_SECRET_ABSENT';
          } else {
            const site = await get('/sites/' + expected.site_id);
            if (site.ok && site.body?.id === expected.site_id) {
              const s = site.body, repo = s.build_settings ?? s.repo ?? {};
              report.site = {
                id: s.id,
                origin_matches: s.ssl_url === expected.origin,
                account_id: s.account_id ?? null,
                account_slug: s.account_slug ?? null,
                account_matches: s.account_id === expected.account_id || s.account_slug === expected.account_slug,
                repository: repo.repo_path ?? repo.repo_url ?? null,
                branch: repo.repo_branch ?? null,
                published_deploy_id: s.published_deploy?.id ?? null,
                published_commit: s.published_deploy?.commit_ref ?? null
              };
              report.finding = 'GITHUB_CREDENTIAL_CAN_READ_EXACT_PRODUCTION_SITE';
              report.deployment_write_access_proven = false;
            } else {
              const user = await get('/user');
              report.credential_identity = {http_status: user.status, user_id: user.ok ? user.body?.id ?? null : null};
              const accounts = await get('/accounts');
              if (accounts.ok && Array.isArray(accounts.body)) {
                report.accessible_accounts = accounts.body.map(a => ({id: a.id, slug: a.slug}));
                report.expected_account_listed = accounts.body.some(a => a.id === expected.account_id || a.slug === expected.account_slug);
              }
              const sites = await get('/sites?per_page=100&page=1');
              if (sites.ok && Array.isArray(sites.body)) {
                report.site_listing = {
                  count_on_first_page: sites.body.length,
                  first_page_contains_expected_site: sites.body.some(s => s.id === expected.site_id),
                  first_page_exhausts_listing: sites.body.length < 100
                };
              }
              report.finding = user.ok
                ? 'CREDENTIAL_AUTHENTICATES_BUT_EXACT_SITE_READ_FAILED'
                : 'EXACT_SITE_READ_FAILED_SEE_ENDPOINT_STATUSES';
            }
          }
          console.log(JSON.stringify(report, null, 2));
          JS
