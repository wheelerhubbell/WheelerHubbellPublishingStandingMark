[build]
  command = "npm run build:buyer"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg", "@netlify/database"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/standing/:splat"
  status = 200
  force = true

[build.environment]
  WHP_ORIGIN = "https://wheelerhubbellpublishingstandingmark.netlify.app"
