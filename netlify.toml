[build]
  command = "npm run check:activation && npm run check:open-acquisition"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg", "@netlify/database"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/standing/:splat"
  status = 200
  force = true

[build.environment]
  NODE_VERSION = "24"
  PYTHON_VERSION = "3.12"
  WHP_ORIGIN = "https://wheelerhubbellpublishingstandingmark.netlify.app"
